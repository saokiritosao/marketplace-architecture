services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - marketplace-data:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 3s
      timeout: 3s
      retries: 20

  flyway:
    image: flyway/flyway:13.10.3-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/marketplace
      FLYWAY_USER: marketplace
      FLYWAY_PASSWORD: marketplace
      FLYWAY_CONNECT_RETRIES: 10
    volumes:
      - ./migrations:/flyway/sql:ro
    command: migrate

  api:
    build: .
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://marketplace:marketplace@postgres:5432/marketplace?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      JWT_ISSUER: marketplace-api
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-20m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-336h}
      ORDER_RATE_LIMIT: ${ORDER_RATE_LIMIT:-1m}
    depends_on:
      flyway:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  marketplace-data:
